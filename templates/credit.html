<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SNXTH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #05050a;
      --text: #e8e8f0;
      --muted: #44445a;
      --accent: #7c6af7;
      --accent2: #c084fc;
      --mono: 'Space Mono', monospace;
      --display: 'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated grid background */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,106,247,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,106,247,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridShift 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridShift {
      from { transform: translateY(0); }
      to   { transform: translateY(60px); }
    }

    /* Glowing orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      z-index: 0;
      animation: orbFloat 8s ease-in-out infinite alternate;
    }
    .orb-1 { width: 400px; height: 400px; background: #7c6af7; top: -100px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 300px; height: 300px; background: #c084fc; bottom: -80px; right: -80px; animation-delay: -4s; }

    @keyframes orbFloat {
      from { transform: translate(0, 0); }
      to   { transform: translate(40px, 30px); }
    }

    /* Main content */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    /* Glitch name */
    .name {
      font-family: var(--display);
      font-size: clamp(5rem, 18vw, 12rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.9;
      position: relative;
      display: inline-block;
      color: transparent;
      -webkit-text-stroke: 1px rgba(124,106,247,0.6);
      animation: nameReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .name::before,
    .name::after {
      content: 'SNXTH';
      position: absolute;
      inset: 0;
      font-family: var(--display);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .name::before {
      background: linear-gradient(135deg, #7c6af7, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      -webkit-text-stroke: 0;
      animation: glitch1 4s infinite;
      clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
    }

    .name::after {
      background: linear-gradient(135deg, #c084fc, #7c6af7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      -webkit-text-stroke: 0;
      animation: glitch2 4s infinite;
      clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
    }

    @keyframes nameReveal {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes glitch1 {
      0%, 90%, 100% { transform: translate(0, 0); }
      92%            { transform: translate(-4px, -1px); }
      94%            { transform: translate(4px, 1px); }
      96%            { transform: translate(-2px, 0); }
    }

    @keyframes glitch2 {
      0%, 90%, 100% { transform: translate(0, 0); }
      92%            { transform: translate(4px, 1px); }
      94%            { transform: translate(-4px, -1px); }
      96%            { transform: translate(2px, 0); }
    }

    /* Tagline */
    .tagline {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-top: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.6s forwards;
    }

    /* Typing cursor line */
    .cursor-line {
      display: inline-block;
      width: 2px;
      height: 0.9em;
      background: var(--accent);
      vertical-align: middle;
      margin-left: 4px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* Discord button */
    .discord-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 3rem;
      padding: 0.9rem 2rem;
      border: 1px solid rgba(124,106,247,0.4);
      border-radius: 4px;
      color: var(--text);
      text-decoration: none;
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.8s ease 1s forwards;
      transition: border-color 0.3s, color 0.3s;
    }

    .discord-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(124,106,247,0.12), rgba(192,132,252,0.12));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .discord-btn:hover { border-color: var(--accent2); }
    .discord-btn:hover::before { opacity: 1; }

    .discord-icon {
      width: 18px;
      height: 18px;
      fill: var(--accent2);
      flex-shrink: 0;
    }

    /* Scan line effect */
    .scanline {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      z-index: 2;
      pointer-events: none;
    }

    /* Bottom bar */
    .bottom-bar {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      z-index: 1;
      opacity: 0;
      animation: fadeUp 0.8s ease 1.4s forwards;
    }

    /* Animated dots */
    .dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 2rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.8s forwards;
    }

    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      animation: dotPulse 1.5s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.3s; background: var(--accent2); }
    .dot:nth-child(3) { animation-delay: 0.6s; }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50%       { opacity: 1; transform: scale(1.5); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .name, .tagline, .discord-btn, .dots, .bottom-bar { opacity: 1; }
      .name::before, .name::after { transform: none !important; }
    }
  </style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="scanline"></div>

  <main class="content">
    <div class="name">SNXTH</div>
    <p class="tagline">built this<span class="cursor-line"></span></p>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <a href="https://discord.gg/SxKrcrHuRg" target="_blank" rel="noopener" class="discord-btn">
      <svg class="discord-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

      </svg>
      Join my Discord
    </a>
  </main>

  <p class="bottom-bar">SNXTH · linksnip · 2026</p>

</body>
</html>
